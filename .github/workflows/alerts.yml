# Always-on alerts: runs the background engine every 5 minutes on weekdays during NSE + MCX hours, so CALL/PUT,
# BTST/2-day and news alerts reach your phone even when no one has the portal open (Streamlit Cloud sleeps and
# cannot run runner.py). The engine skips closed markets and exchange holidays by itself.
#
# One-time setup (GitHub -> Settings -> Secrets and variables -> Actions):
#   Secrets:   UPSTOX_ANALYTICS_TOKEN   (same token as in secrets.toml)      NTFY_TOPIC   (your ntfy topic)
#              DATABASE_URL  (the Neon postgresql://... link: one journal/track record shared with the portal)
#              optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   Variables: optional WATCHLIST (e.g. "NIFTY, BANKNIFTY, RELIANCE, CRUDE"), optional ALERT_GRADE (A/B/C/D),
#              optional SCAN_UNIVERSE=fno to scan every NSE F&O stock (~210) as well (use ALERT_GRADE=B or A)
#
# State (alert de-duplication, paper journal, track record, option-chain snapshots) is kept between runs in the
# Actions cache. GitHub may start scheduled runs a few minutes late and pauses schedules after 60 days without
# repository activity (re-enable under Actions).
name: Market alerts

on:
  schedule:
    - cron: "*/5 3-17 * * 1-5"  # 08:30-23:25 IST, Monday-Friday
  workflow_dispatch:

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      TRAD_DATA_DIR: ${{ github.workspace }}/state
      UPSTOX_MAX_WAIT: "300"  # queue for Upstox's per-minute / 30-minute budget instead of failing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Restore engine state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: srk-state-${{ github.run_id }}
          restore-keys: srk-state-

      - name: Scan and alert
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          ALERT_GRADE: ${{ vars.ALERT_GRADE }}
          SCAN_UNIVERSE: ${{ vars.SCAN_UNIVERSE }}
        run: |
          mkdir -p state
          if [ -z "$UPSTOX_ANALYTICS_TOKEN" ]; then echo "::warning::UPSTOX_ANALYTICS_TOKEN secret not set: using delayed Yahoo + NSE data"; fi
          if [ -z "$NTFY_TOPIC" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::warning::No NTFY_TOPIC / TELEGRAM secrets: alerts are logged but not pushed"; fi
          python runner.py --once --cloud

      - name: Alert the phone when this job fails (once an hour)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p state
          mark="state/job_failed_$(date +%Y%m%d%H)"
          if [ -n "$NTFY_TOPIC" ] && [ ! -f "$mark" ]; then
            touch "$mark"
            curl -s -H "Title: SRK alerts job failed" -H "Tags: warning" -H "Priority: high" \
              -d "The scheduled market scan failed, so alerts may be missing. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || true
          fi

      - name: Save engine state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: srk-state-${{ github.run_id }}
