# Builds the Android app (APK) in the cloud on every push that touches android/, or on demand
# (GitHub -> Actions -> "Build Android app" -> Run workflow). Download it from the run's Artifacts.
name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SRK-Options.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SRK-Options-apk
          path: SRK-Options.apk
          retention-days: 30
