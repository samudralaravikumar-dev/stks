# Builds the Android app (APK) in the cloud on every push that touches android/, or on demand
# (GitHub -> Actions -> "Build Android app" -> Run workflow). Download it from the run's Artifacts.
# Each build has a higher version number and the same signing key, so it installs over the previous one.
name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Validates the wrapper JAR checksum on every run; basic = open-source actions/cache provider
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The signing key lives only in repository secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD).
      # Without them the APK is signed with a throwaway debug key and must be uninstalled before each update.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # tolerate copy-paste debris: line breaks/spaces in the key, a "Value:" label, padding around the password
            b64=$(printf '%s' "$KEYSTORE_B64" | sed 's/^Value[^:]*://' | tr -d ' \t\r\n')
            pw=$(printf '%s' "$KEYSTORE_PASSWORD" | sed 's/^Value:[[:space:]]*//' | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if ! printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/signing.p12" 2>/dev/null; then
              echo "::error::ANDROID_KEYSTORE_B64 is not valid base64 (${#b64} chars after trimming; expected 3504). Re-paste the long line from signing-secrets.txt."
              exit 1
            fi
            if ! keytool -list -storetype pkcs12 -keystore "$RUNNER_TEMP/signing.p12" -storepass "$pw" -alias srk > /dev/null 2>&1; then
              echo "::error::Signing key check failed: ANDROID_KEYSTORE_PASSWORD (${#pw} chars; expected 32) does not open the keystore from ANDROID_KEYSTORE_B64 (${#b64} chars; expected 3504). Re-paste both values from signing-secrets.txt."
              exit 1
            fi
            echo "Signing key OK"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "::add-mask::$pw"
            echo "SIGNING_STORE_PASSWORD=$pw" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets not set: APK signed with a temporary debug key (uninstall the old app before installing)."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "SRK-Options-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: SRK-Options-apk-v1.1.${{ github.run_number }}
          path: SRK-Options-v1.1.${{ github.run_number }}.apk
          retention-days: 30
