<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
// Device sign-in store: keeps the remember-me token in this browser's localStorage (persistent in the Android
// WebView) and hands it to the server. Cookies are not enough on Streamlit Cloud: its proxy does not pass them on.
// Speaks the Streamlit component protocol directly (no build step). Args: action get|set|clear, value, key_name.
(function () {
  var last;
  function send(type, data) {
    var msg = {isStreamlitMessage: true, type: type};
    for (var k in (data || {})) msg[k] = data[k];
    window.parent.postMessage(msg, "*");
  }
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.type !== "streamlit:render") return;
    var a = d.args || {}, key = a.key_name || "srk_session", v = "";
    try {
      if (a.action === "set" && a.value) localStorage.setItem(key, a.value);
      if (a.action === "clear") localStorage.removeItem(key);
      v = localStorage.getItem(key) || "";
    } catch (err) { v = ""; }
    if (v !== last) {  // only report changes, so the app is not rerun again and again
      last = v;
      send("streamlit:setComponentValue", {value: v, dataType: "json"});
    }
  });
  send("streamlit:componentReady", {apiVersion: 1});
  send("streamlit:setFrameHeight", {height: 0});
})();
</script>
</body>
</html>
