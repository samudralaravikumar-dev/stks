plugins {
    id "com.android.application"
}

// Every CI build gets a higher versionCode, so Android installs a new APK as an update (local builds: 1)
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Portal address built into the app, so it opens straight away (no typing). Set it in DEFAULT_PORTAL_URL below,
// or without editing code as the GitHub repository variable PORTAL_URL (Settings -> Secrets and variables ->
// Actions -> Variables), which CI passes in as an environment variable. It can still be changed in the app.
def DEFAULT_PORTAL_URL = "https://srktrade.streamlit.app"
def portalUrl = (System.getenv("PORTAL_URL") ?: DEFAULT_PORTAL_URL).trim()

android {
    namespace "com.srk.tradingportal"
    compileSdk 34

    defaultConfig {
        applicationId "com.srk.tradingportal"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.1.${buildNumber}"
        resValue "string", "default_url", portalUrl
    }

    // One private key for every build (env vars set by CI from GitHub secrets; the key file is never committed).
    // Without it each CI run signs with a fresh random debug key and Android refuses to install the new APK over
    // the old one ("App not installed"), forcing an uninstall that also wipes the saved sign-in.
    def storePath = System.getenv("SIGNING_STORE_FILE")
    signingConfigs {
        portal {
            if (storePath) {
                storeFile file(storePath)
                storeType "pkcs12"
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: "srk"
                keyPassword System.getenv("SIGNING_STORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // no key configured (secrets not added yet, or a local build): fall back to the debug key
            signingConfig storePath ? signingConfigs.portal : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false  // a lint warning must not block the APK
    }
}

dependencies {
    // Align kotlin-stdlib-jdk7/jdk8 with kotlin-stdlib (avoids "Duplicate class kotlin..." from transitive deps)
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
